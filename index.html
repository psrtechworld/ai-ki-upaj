<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceAI - Text to Speech</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at top left,#312e81 0,transparent 35%),
    radial-gradient(circle at bottom right,#0e7490 0,transparent 30%),
    #09090f;
  color:#fff;
  padding:30px 16px;
}

.container{max-width:1050px;margin:auto}

.header{text-align:center;margin:35px 0 30px}

.logo{
  display:inline-block;
  background:linear-gradient(135deg,#8b5cf6,#06b6d4);
  padding:10px 18px;
  border-radius:14px;
  font-weight:800;
  margin-bottom:18px;
}

h1{
  font-size:clamp(32px,6vw,58px);
  margin-bottom:12px;
}

.gradient{
  background:linear-gradient(90deg,#a78bfa,#22d3ee);
  -webkit-background-clip:text;
  color:transparent;
}

.subtitle{color:#a1a1aa;font-size:17px}

.card{
  background:rgba(20,20,30,.85);
  border:1px solid rgba(255,255,255,.1);
  border-radius:24px;
  padding:25px;
  backdrop-filter:blur(20px);
  box-shadow:0 20px 70px rgba(0,0,0,.3);
}

label{
  display:block;
  color:#d4d4d8;
  font-size:14px;
  font-weight:600;
  margin-bottom:9px;
}

textarea{
  width:100%;
  min-height:240px;
  resize:vertical;
  border:1px solid #27272a;
  background:#0f0f17;
  color:white;
  border-radius:16px;
  padding:18px;
  font-size:17px;
  line-height:1.6;
  outline:none;
}

textarea:focus{
  border-color:#8b5cf6;
  box-shadow:0 0 0 3px rgba(139,92,246,.15);
}

.counter{
  text-align:right;
  color:#71717a;
  font-size:13px;
  margin-top:7px;
}

.settings{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:22px;
}

.field select,
.field input{
  width:100%;
  padding:13px;
  background:#0f0f17;
  border:1px solid #27272a;
  border-radius:12px;
  color:white;
  outline:none;
}

.range-value{
  color:#a78bfa;
  font-weight:700;
  float:right;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:25px;
}

button{
  border:0;
  padding:14px 21px;
  border-radius:13px;
  font-weight:700;
  cursor:pointer;
  color:white;
  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

.primary{
  background:linear-gradient(135deg,#7c3aed,#0891b2);
}

.secondary{background:#27272a}

.danger{background:#7f1d1d}

.download{
  background:linear-gradient(135deg,#059669,#10b981);
}

.visualizer{
  height:90px;
  margin-top:25px;
  background:#0b0b12;
  border-radius:16px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  overflow:hidden;
}

.bar{
  width:5px;
  height:15px;
  border-radius:5px;
  background:linear-gradient(#8b5cf6,#22d3ee);
}

.speaking .bar{
  animation:wave .6s infinite ease-in-out alternate;
}

.speaking .bar:nth-child(2n){animation-delay:.1s}
.speaking .bar:nth-child(3n){animation-delay:.2s}

@keyframes wave{
  from{height:12px}
  to{height:65px}
}

.status{
  margin-top:20px;
  padding:14px;
  border-radius:12px;
  background:#111827;
  color:#a1a1aa;
  display:none;
}

.status.show{display:block}

.audio-box{
  margin-top:20px;
  display:none;
  background:#111118;
  padding:18px;
  border-radius:16px;
  border:1px solid #27272a;
}

.audio-box.show{display:block}

audio{width:100%}

.footer{
  text-align:center;
  color:#52525b;
  margin-top:25px;
  font-size:13px;
}

@media(max-width:700px){
  .settings{grid-template-columns:1fr}
  .card{padding:17px}
}
</style>
</head>

<body>

<div class="container">

<header class="header">
  <div class="logo">🎙️ VoiceAI</div>

  <h1>
    Turn Text Into
    <span class="gradient">Voice</span>
  </h1>

  <p class="subtitle">
    Type your text, choose a voice and download the generated audio.
  </p>
</header>

<main class="card">

<label for="text">Your Text</label>

<textarea id="text"
placeholder="Type something here...

Example:
Hello! Welcome to VoiceAI. This is a simple text to speech demo."></textarea>

<div class="counter">
  <span id="wordCount">0</span> words ·
  <span id="charCount">0</span> characters
</div>

<div class="settings">

<div class="field">
<label for="voice">Voice</label>
<select id="voice">
<option>Loading voices...</option>
</select>
</div>

<div class="field">
<label>
Speed
<span class="range-value" id="rateValue">1.0x</span>
</label>

<input
type="range"
id="rate"
min="0.5"
max="2"
value="1"
step="0.1">
</div>

<div class="field">
<label>
Pitch
<span class="range-value" id="pitchValue">1.0</span>
</label>

<input
type="range"
id="pitch"
min="0"
max="2"
value="1"
step="0.1">
</div>

</div>

<div class="visualizer" id="visualizer">

<script>
for(let i=0;i<28;i++){
  document.write('<div class="bar"></div>');
}
</script>

</div>

<div class="buttons">

<button class="primary" id="speakBtn">
▶ Generate Voice
</button>

<button class="secondary" id="pauseBtn">
⏸ Pause
</button>

<button class="secondary" id="resumeBtn">
▶ Resume
</button>

<button class="danger" id="stopBtn">
■ Stop
</button>

<button class="download" id="downloadBtn">
📥 Download Audio
</button>

<button class="secondary" id="clearBtn">
Clear
</button>

</div>

<div class="status" id="status"></div>

<div class="audio-box" id="audioBox">

<label>Generated Audio</label>

<audio id="audioPlayer" controls></audio>

</div>

</main>

<div class="footer">
VoiceAI Demo · Text to Speech
</div>

</div>

<script>

const textBox =
document.getElementById("text");

const voiceSelect =
document.getElementById("voice");

const rate =
document.getElementById("rate");

const pitch =
document.getElementById("pitch");

const rateValue =
document.getElementById("rateValue");

const pitchValue =
document.getElementById("pitchValue");

const speakBtn =
document.getElementById("speakBtn");

const pauseBtn =
document.getElementById("pauseBtn");

const resumeBtn =
document.getElementById("resumeBtn");

const stopBtn =
document.getElementById("stopBtn");

const downloadBtn =
document.getElementById("downloadBtn");

const clearBtn =
document.getElementById("clearBtn");

const status =
document.getElementById("status");

const visualizer =
document.getElementById("visualizer");

const audioBox =
document.getElementById("audioBox");

const audioPlayer =
document.getElementById("audioPlayer");

let voices = [];

let mediaRecorder = null;
let recordedChunks = [];
let audioStream = null;
let audioURL = null;


/* ---------------- VOICES ---------------- */

function loadVoices(){

  voices = speechSynthesis.getVoices();

  voiceSelect.innerHTML = "";

  if(!voices.length){

    const option =
    document.createElement("option");

    option.textContent =
    "No voices found";

    voiceSelect.appendChild(option);

    return;
  }

  voices.forEach((voice,index)=>{

    const option =
    document.createElement("option");

    option.value = index;

    option.textContent =
      `${voice.name} (${voice.lang})`;

    voiceSelect.appendChild(option);

  });

  const englishIndex =
    voices.findIndex(v =>
      v.lang.toLowerCase().startsWith("en")
    );

  if(englishIndex >= 0){
    voiceSelect.value = englishIndex;
  }
}

speechSynthesis.onvoiceschanged =
loadVoices;

loadVoices();


/* ---------------- COUNTER ---------------- */

function updateCounter(){

  const text =
  textBox.value.trim();

  const words =
  text ? text.split(/\s+/).length : 0;

  document.getElementById("wordCount")
    .textContent = words;

  document.getElementById("charCount")
    .textContent =
    textBox.value.length;
}

textBox.addEventListener(
  "input",
  updateCounter
);


/* ---------------- SETTINGS ---------------- */

rate.addEventListener("input",()=>{

  rateValue.textContent =
    rate.value + "x";

});

pitch.addEventListener("input",()=>{

  pitchValue.textContent =
    pitch.value;

});


/* ---------------- STATUS ---------------- */

function showStatus(message){

  status.textContent =
  message;

  status.classList.add("show");

}


/* ---------------- SPEECH ---------------- */

speakBtn.addEventListener("click",()=>{

  const text =
  textBox.value.trim();

  if(!text){

    showStatus(
      "⚠️ Please enter some text first."
    );

    return;
  }

  speechSynthesis.cancel();

  const utterance =
  new SpeechSynthesisUtterance(text);

  const selectedVoice =
  voices[voiceSelect.value];

  if(selectedVoice){

    utterance.voice =
    selectedVoice;

    utterance.lang =
    selectedVoice.lang;
  }

  utterance.rate =
    parseFloat(rate.value);

  utterance.pitch =
    parseFloat(pitch.value);

  utterance.onstart = ()=>{

    visualizer.classList
      .add("speaking");

    showStatus(
      "🔊 Speaking..."
    );

  };

  utterance.onend = ()=>{

    visualizer.classList
      .remove("speaking");

    showStatus(
      "✅ Voice finished."
    );

  };

  utterance.onerror = (event)=>{

    visualizer.classList
      .remove("speaking");

    showStatus(
      "❌ Voice error: " +
      event.error
    );

  };

  speechSynthesis.speak(
    utterance
  );

});


/* ---------------- PAUSE ---------------- */

pauseBtn.addEventListener("click",()=>{

  if(speechSynthesis.speaking){

    speechSynthesis.pause();

    showStatus(
      "⏸ Voice paused."
    );

  }

});


/* ---------------- RESUME ---------------- */

resumeBtn.addEventListener("click",()=>{

  if(speechSynthesis.paused){

    speechSynthesis.resume();

    showStatus(
      "▶ Voice resumed."
    );

  }

});


/* ---------------- STOP ---------------- */

stopBtn.addEventListener("click",()=>{

  speechSynthesis.cancel();

  visualizer.classList
    .remove("speaking");

  showStatus(
    "■ Voice stopped."
  );

});


/* ==================================================
   DOWNLOAD AUDIO
   ================================================== */

downloadBtn.addEventListener(
"click",
async()=>{

  const text =
  textBox.value.trim();

  if(!text){

    showStatus(
      "⚠️ Enter text before downloading."
    );

    return;
  }

  /*
    Browser speechSynthesis doesn't expose
    its generated audio directly.

    We therefore capture the browser/tab audio.
  */

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getDisplayMedia){

    showStatus(
      "❌ Your browser does not support audio capture. Use Chrome or Edge."
    );

    return;
  }

  try{

    showStatus(
      "🎙️ Select this browser tab and enable tab audio..."
    );

    audioStream =
      await navigator.mediaDevices.getDisplayMedia({

        video:true,

        audio:true

      });


    const audioTracks =
      audioStream.getAudioTracks();

    if(!audioTracks.length){

      audioStream
        .getTracks()
        .forEach(track=>track.stop());

      showStatus(
        "⚠️ Please enable 'Share tab audio' when selecting the tab."
      );

      return;
    }


    /*
      Only keep audio track.
    */

    const audioOnlyStream =
      new MediaStream(
        audioTracks
      );


    recordedChunks = [];


    let options = {};

    if(MediaRecorder.isTypeSupported(
      "audio/webm;codecs=opus"
    )){

      options.mimeType =
        "audio/webm;codecs=opus";

    }
    else if(MediaRecorder.isTypeSupported(
      "audio/webm"
    )){

      options.mimeType =
        "audio/webm";

    }


    mediaRecorder =
      new MediaRecorder(
        audioOnlyStream,
        options
      );


    mediaRecorder.ondataavailable =
    event=>{

      if(event.data.size > 0){

        recordedChunks.push(
          event.data
        );

      }

    };


    mediaRecorder.onstop = ()=>{

      const blob =
        new Blob(
          recordedChunks,
          {
            type:
              mediaRecorder.mimeType ||
              "audio/webm"
          }
        );


      if(audioURL){
        URL.revokeObjectURL(
          audioURL
        );
      }


      audioURL =
        URL.createObjectURL(
          blob
        );


      audioPlayer.src =
        audioURL;

      audioBox.classList
        .add("show");


      const link =
        document.createElement("a");

      link.href =
        audioURL;

      link.download =
        "voiceai-audio.webm";

      link.click();


      showStatus(
        "✅ Audio downloaded successfully."
      );


      audioStream
        .getTracks()
        .forEach(track=>{
          track.stop();
        });

    };


    /*
      Start recording
    */

    mediaRecorder.start();


    showStatus(
      "🔴 Recording voice... Please wait."
    );


    /*
      Start speech
    */

    speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(text);


    const selectedVoice =
      voices[voiceSelect.value];


    if(selectedVoice){

      utterance.voice =
        selectedVoice;

      utterance.lang =
        selectedVoice.lang;

    }


    utterance.rate =
      parseFloat(rate.value);

    utterance.pitch =
      parseFloat(pitch.value);


    utterance.onstart = ()=>{

      visualizer.classList
        .add("speaking");

    };


    utterance.onend = ()=>{

      visualizer.classList
        .remove("speaking");


      /*
        Give browser a moment
        to capture final audio.
      */

      setTimeout(()=>{

        if(
          mediaRecorder &&
          mediaRecorder.state !== "inactive"
        ){

          mediaRecorder.stop();

        }

      },500);

    };


    utterance.onerror = ()=>{

      visualizer.classList
        .remove("speaking");

      if(
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
      ){

        mediaRecorder.stop();

      }

      showStatus(
        "❌ Voice generation failed."
      );

    };


    speechSynthesis.speak(
      utterance
    );


  }
  catch(error){

    console.error(error);

    showStatus(
      "❌ Audio capture cancelled or unavailable."
    );

  }

});


/* ---------------- CLEAR ---------------- */

clearBtn.addEventListener(
"click",
()=>{

  speechSynthesis.cancel();

  textBox.value = "";

  updateCounter();

  visualizer.classList
    .remove("speaking");

  showStatus(
    "Text cleared."
  );

});

</script>

</body>
</html>
