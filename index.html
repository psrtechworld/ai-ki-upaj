<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice Maker</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#09090f,#17112d);
  color:white;
  min-height:100vh;
  padding:30px 15px;
}

.container{
  max-width:850px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:30px;
}

.logo{
  display:inline-block;
  padding:10px 18px;
  border-radius:12px;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  font-weight:bold;
  margin-bottom:15px;
}

h1{
  font-size:48px;
  margin:5px 0 10px;
}

.gradient{
  background:linear-gradient(90deg,#a78bfa,#22d3ee);
  -webkit-background-clip:text;
  color:transparent;
}

.subtitle{
  color:#aaa;
}

.card{
  background:rgba(25,25,35,.9);
  border:1px solid #30303c;
  border-radius:22px;
  padding:25px;
  box-shadow:0 20px 70px rgba(0,0,0,.4);
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
  color:#ddd;
}

textarea{
  width:100%;
  height:240px;
  resize:vertical;
  background:#0d0d14;
  color:white;
  border:1px solid #333341;
  border-radius:15px;
  padding:17px;
  font-size:17px;
  line-height:1.6;
  outline:none;
}

textarea:focus{
  border-color:#8b5cf6;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

select{
  width:100%;
  background:#0d0d14;
  color:white;
  border:1px solid #333341;
  border-radius:12px;
  padding:13px;
}

.buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:22px;
}

button{
  border:none;
  border-radius:12px;
  padding:14px 20px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
}

.generate{
  background:linear-gradient(135deg,#7c3aed,#0891b2);
}

.stop{
  background:#7f1d1d;
}

.download{
  background:#059669;
  display:none;
}

button:hover{
  opacity:.9;
  transform:translateY(-1px);
}

.status{
  margin-top:18px;
  background:#111827;
  border-radius:12px;
  padding:13px;
  color:#aaa;
  display:none;
}

.status.show{
  display:block;
}

.audio{
  margin-top:22px;
  display:none;
}

.audio.show{
  display:block;
}

audio{
  width:100%;
}

.counter{
  color:#777;
  text-align:right;
  font-size:13px;
  margin-top:7px;
}

@media(max-width:600px){
  h1{
    font-size:35px;
  }

  .controls{
    grid-template-columns:1fr;
  }

  .card{
    padding:18px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      🎙️ Voice Maker
    </div>

    <h1>
      Text to <span class="gradient">Voice</span>
    </h1>

    <p class="subtitle">
      Type your text, generate voice and download the audio.
    </p>

  </div>


  <div class="card">

    <label>Enter your text</label>

    <textarea
      id="text"
      placeholder="Type something here...

Example:
Hello! Welcome to my AI voice generator.">
    </textarea>

    <div class="counter">
      <span id="count">0</span> characters
    </div>


    <div class="controls">

      <div>

        <label>Language</label>

        <select id="language">

          <option value="en">
            English
          </option>

          <option value="hi">
            Hindi
          </option>

          <option value="es">
            Spanish
          </option>

          <option value="fr">
            French
          </option>

          <option value="de">
            German
          </option>

          <option value="it">
            Italian
          </option>

          <option value="pt">
            Portuguese
          </option>

          <option value="ja">
            Japanese
          </option>

        </select>

      </div>


      <div>

        <label>Voice style</label>

        <select id="style">

          <option value="normal">
            Normal
          </option>

          <option value="slow">
            Slow
          </option>

        </select>

      </div>

    </div>


    <div class="buttons">

      <button
        class="generate"
        onclick="generateVoice()">

        🔊 Generate Voice

      </button>


      <button
        class="stop"
        onclick="stopVoice()">

        ■ Stop

      </button>


      <button
        id="download"
        class="download">

        📥 Download Audio

      </button>

    </div>


    <div
      id="status"
      class="status">
    </div>


    <div
      id="audioBox"
      class="audio">

      <label>
        Generated Audio
      </label>

      <audio
        id="player"
        controls>
      </audio>

    </div>

  </div>

</div>


<script>

const text =
document.getElementById("text");

const language =
document.getElementById("language");

const style =
document.getElementById("style");

const player =
document.getElementById("player");

const download =
document.getElementById("download");

const status =
document.getElementById("status");

const audioBox =
document.getElementById("audioBox");

let audioURL = null;


/* Character counter */

text.addEventListener("input",()=>{

  document.getElementById("count")
    .textContent =
    text.value.length;

});


/* Status */

function showStatus(message){

  status.textContent = message;

  status.classList.add("show");

}


/* Generate */

async function generateVoice(){

  const value =
    text.value.trim();

  if(!value){

    showStatus(
      "⚠️ Please enter some text first."
    );

    return;
  }


  /*
    Google Translate TTS has a practical
    text-length limitation.

    Keep demo text reasonably short.
  */

  if(value.length > 180){

    showStatus(
      "⚠️ For this demo, please keep the text under 180 characters."
    );

    return;
  }


  const lang =
    language.value;

  const speed =
    style.value === "slow"
    ? 0.5
    : 1;


  showStatus(
    "🔄 Generating audio..."
  );


  try{

    /*
      TTS endpoint
    */

    const url =
      "https://translate.google.com/translate_tts" +
      "?ie=UTF-8" +
      "&q=" +
      encodeURIComponent(value) +
      "&tl=" +
      encodeURIComponent(lang) +
      "&client=tw-ob";


    /*
      Load audio
    */

    player.src = url;

    player.playbackRate = speed;


    /*
      Test whether audio can load
    */

    player.onloadeddata = ()=>{

      audioBox.classList.add("show");

      download.style.display =
        "inline-block";

      showStatus(
        "✅ Voice generated successfully."
      );

    };


    player.onerror = ()=>{

      showStatus(
        "❌ Audio could not be generated. Check your internet connection."
      );

    };


    /*
      Download button
    */

    download.onclick = async()=>{

      try{

        showStatus(
          "⬇️ Downloading audio..."
        );


        const response =
          await fetch(url);


        if(!response.ok){

          throw new Error(
            "Download failed"
          );

        }


        const blob =
          await response.blob();


        const blobURL =
          URL.createObjectURL(blob);


        const link =
          document.createElement("a");


        link.href =
          blobURL;


        link.download =
          "voice-maker.mp3";


        document.body.appendChild(
          link
        );


        link.click();


        link.remove();


        URL.revokeObjectURL(
          blobURL
        );


        showStatus(
          "✅ Audio downloaded."
        );

      }
      catch(error){

        /*
          Some browsers may block
          cross-origin downloading.
        */

        showStatus(
          "⚠️ Direct download blocked by the browser. Use the audio player's menu to download the audio."
        );

      }

    };


    player.load();


  }
  catch(error){

    console.error(error);

    showStatus(
      "❌ Something went wrong."
    );

  }

}


/* Stop */

function stopVoice(){

  player.pause();

  player.currentTime = 0;

  showStatus(
    "■ Audio stopped."
  );

}

</script>

</body>
</html>
